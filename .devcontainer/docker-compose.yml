services:
  binfmt:
    image: tonistiigi/binfmt:latest
    privileged: true
    command: ["--install", "arm64"]
    restart: "no"

  dev-amd64:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        VARIANT: "8.0-jammy"
    platform: linux/amd64
    volumes:
      - ..:/workspaces/gdbsos:cached
    working_dir: /workspaces/gdbsos
    user: vscode
    privileged: true
    tty: true
    command: sleep infinity
    environment: {}

  dev-arm64:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        VARIANT: "8.0-jammy"
    platform: linux/arm64
    volumes:
      - ..:/workspaces/gdbsos:cached
    working_dir: /workspaces/gdbsos
    user: vscode
    privileged: true
    tty: true
    depends_on:
      binfmt:
        condition: service_completed_successfully
    command: sleep infinity
    environment: {}
